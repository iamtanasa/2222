<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Spânzurătoarea - Lobby</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="hangman.css" />
</head>
<body class="page-entry" data-page="hangman-lobby">
  <div class="bulls-container">
    <div class="back-button">&larr; Înapoi</div>
    <div class="bulls-icon">🪢</div>
    <h1>Spânzurătoarea</h1>
    

    <div class="glass-card bulls-card">
      <div class="section">
        <h2 class="section-title">Cine joacă?</h2>
        <input id="hangman-player-name" type="text" maxlength="20" placeholder="Numele tău" />
      </div>

      <div class="section">
        <h2 class="section-title">Creează o cameră nouă</h2>
        
        <button id="hangman-create-room" class="btn-primary">Creează cameră</button>
      </div>

      <div class="section">
        <h2 class="section-title">Intră într-o cameră</h2>
        
        <div class="join-room">
          <input id="hangman-room-code" type="text" maxlength="4" placeholder="Cod (ex: ABCD)" />
          <button id="hangman-join-room" class="btn-secondary">Intră</button>
        </div>
      </div>

      
    </div>
  </div>

  <!-- Script global cu login + recordWin + efecte vizuale -->
  <script src="../script.js"></script>
  <!-- Scriptul specific pentru Spânzurătoarea -->
  <script src="hangman.js"></script>
</body>
</html>
