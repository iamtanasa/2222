<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Triunghiuri din puncte - Lobby</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-entry" data-page="triangles-lobby">
  <div class="bulls-container">
    <div class="back-button" onclick="navigateTo('../2222.html')">&larr; Înapoi</div>

    <div class="bulls-icon">🔺</div>
    <h1>Triunghiuri din puncte</h1>
    <p class="subtitle">Desenează linii și formează cât mai multe triunghiuri.</p>

    <div class="glass-card bulls-card">
      <div class="section">
        <h2 class="section-title">Cine joacă?</h2>
        <input id="triangles-player-name" type="text" placeholder="Ex: Andrei" maxlength="20" />
        
      </div>

      <div class="section">
        <h2 class="section-title">Mod de joc</h2>
        <div class="difficulty-grid">
          <div class="difficulty-card triangles-mode-card btn-selected" data-mode="easy">
            <div class="difficulty-icon">🟢</div>
            <div class="difficulty-name">Ușor</div>
            <div class="difficulty-desc">14 puncte</div>
          </div>
          <div class="difficulty-card triangles-mode-card" data-mode="medium">
            <div class="difficulty-icon">🟡</div>
            <div class="difficulty-name">Mediu</div>
            <div class="difficulty-desc">20 puncte</div>
          </div>
          <div class="difficulty-card triangles-mode-card" data-mode="hard">
            <div class="difficulty-icon">🔴</div>
            <div class="difficulty-name">Greu</div>
            <div class="difficulty-desc">28 puncte</div>
          </div>
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">Creează o cameră</h2>
        <button id="triangles-create-room" class="btn-primary">Creează camera</button>
        
      </div>

      <div class="section">
        
        <div class="join-room">
          <input id="triangles-room-code" type="text" maxlength="4" placeholder="Cod cameră (4 litere)" />
          <button id="triangles-join-room" class="btn-secondary">Intră în cameră</button>
        </div>
        
      </div>

      <p id="triangles-lobby-status" class="lobby-status"></p>
    </div>
  </div>

  <script src="../script.js"></script>
  <script src="triangles.js"></script>
</body>
</html>
