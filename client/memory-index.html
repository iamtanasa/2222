<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Memory Game - Lobby</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-entry" data-page="memory-lobby">
  <div class="bulls-container">
    <div class="back-button" onclick="window.location.href='../2222.html'">&larr; Înapoi</div>

    <div class="bulls-icon">🧠</div>
    <h1>Memory Game</h1>
    <p class="subtitle">Găsiți perechile de poze din galeria voastră.</p>

    <div class="glass-card bulls-card">
      <div class="section">
        <h2 class="section-title">Cine joacă?</h2>
        
        <div class="input-row">
          <input type="text" id="memory-player-name" placeholder="Numele tău" autocomplete="off" />
        </div>
      </div>

      <div class="section">
        <h2 class="section-title">Mod de joc</h2>
        
        <div class="difficulty-grid">
          <div class="difficulty-card memory-mode-card btn-selected" data-mode="easy">
            <div class="difficulty-icon">🟢</div>
            <div class="difficulty-name">Ușor</div>
            <div class="difficulty-desc">6 perechi</div>
          </div>
          <div class="difficulty-card memory-mode-card" data-mode="medium">
            <div class="difficulty-icon">🟡</div>
            <div class="difficulty-name">Mediu</div>
            <div class="difficulty-desc">10 perechi</div>
          </div>
          <div class="difficulty-card memory-mode-card" data-mode="hard">
            <div class="difficulty-icon">🔴</div>
            <div class="difficulty-name">Greu</div>
            <div class="difficulty-desc">16 perechi</div>
          </div>
        </div>
      </div>

      <div class="section">
        
        <div class="input-row">
          <button id="memory-create-room" class="btn-primary">Creează cameră</button>
        </div>
        <div class="input-row" style="margin-top:12px;">
          <input type="text" id="memory-room-code" maxlength="4" placeholder="Cod cameră (ex: ABCD)" />
        </div>
        <div class="input-row">
          <button id="memory-join-room" class="btn-secondary">Intră în cameră</button>
        </div>
        <p id="memory-lobby-status" class="helper-text" style="margin-top: 10px;"></p>
      </div>
    </div>
  </div>

  <script src="../script.js"></script>
  <script src="memory.js"></script>
</body>
</html>
