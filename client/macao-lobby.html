<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Macao - Lobby</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@300;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-entry" data-page="macao-lobby">
  <div class="bulls-container">
    <div class="back-button" onclick="window.location.href='../2222.html'">&larr; Înapoi</div>

    <div class="bulls-icon">🃏</div>
    <h1>Macao</h1>
    <p class="subtitle">Intră într-o cameră și jucați cu cărțile.</p>

    <div class="glass-card bulls-card">
      <div class="section">
        <h2 class="section-title">Pasul 1: Numele tău</h2>
        <input id="macao-player-name" type="text" maxlength="20" placeholder="Numele tău" />
      </div>

      <div class="section">
        <h2 class="section-title">Creează o cameră nouă</h2>
        <p class="helper-text">Primești un cod pe care îl trimiți partenerului tău.</p>
        <button id="macao-create-room" class="btn-primary">Creează cameră</button>
      </div>

      <div class="section">
        <h2 class="section-title">Intră într-o cameră</h2>
        <p class="helper-text">Introdu codul primit de la partenerul tău.</p>
        <div class="join-room">
          <input id="macao-room-code" type="text" maxlength="4" placeholder="Cod (ex: ABCD)" />
          <button id="macao-join-room" class="btn-secondary">Intră</button>
        </div>
      </div>

      <p id="macao-lobby-status" class="lobby-status">Conectează doi jucători și începeți jocul.</p>
    </div>
  </div>

  <script src="../script.js"></script>
  <script src="macao.js"></script>
</body>
</html>
